<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>차량 건강검진</title>
<script>
/* Follow the car's day/night mode (sent by the app), or the browser's when the page is opened on its own. */
try { document.documentElement.dataset.theme = window.AndroidBridge && AndroidBridge.theme ? AndroidBridge.theme() : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
</script>
<style>
/* In-app layout: one logical canvas (2560 px wide, height follows the window) scaled to the app window.
   Wide window + parked = 3D viewport and two-column inspection panel. Driving or a narrow split window = one summary card.
   Colors follow the Pleos system look: white and black with square corners by day, neutral black by night. */
:root{
  color-scheme: light;
  --scr-bg:#ffffff;
  --bg-2:#ffffff;
  --bg-3:#f4f4f4;
  --stage-1:#2c2f33;
  --stage-2:#17191c;
  --line:#e4e4e4;
  --line-2:#cbcbcb;
  --fg:#111111;
  --muted:#666666;
  --faint:#949494;
  --accent:#111111;
  --on-accent:#ffffff;
  --glass:rgba(255,255,255,.92);
  --hover:rgba(0,0,0,.04);
  --sel:rgba(0,0,0,.06);
  --shadow:rgba(0,0,0,.16);
  --ok:#0b9470;
  --warn:#d16a00;
  --alert:#d93a2f;
  --body:"Noto Sans CJK KR","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Roboto Mono","Noto Sans Mono",ui-monospace,monospace;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --scr-bg:#0b0b0c;
  --bg-2:#111112;
  --bg-3:#1b1b1d;
  --line:#262628;
  --line-2:#3a3a3d;
  --fg:#f2f2f2;
  --muted:#a2a2a2;
  --faint:#707072;
  --accent:#f2f2f2;
  --on-accent:#0b0b0c;
  --glass:rgba(17,17,18,.86);
  --hover:rgba(255,255,255,.05);
  --sel:rgba(255,255,255,.1);
  --shadow:rgba(0,0,0,.6);
  --ok:#3fd0a6;
  --warn:#ffa22e;
  --alert:#ff574c;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--scr-bg);color:var(--fg)}
body{word-break:keep-all;font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--accent);outline-offset:4px}

.screen{position:absolute;left:0;top:0;width:2560px;height:1248px;transform-origin:0 0;background:var(--scr-bg);font-size:30px;line-height:1.45;overflow:hidden}
.apparea{position:absolute;inset:0;overflow:hidden}

/* parked: 3D viewport + inspection panel */
.park{position:absolute;inset:0;display:grid;grid-template-columns:1360px 1200px}
.drive{display:none}
.screen[data-view="card"] .park{display:none}
.screen[data-view="card"] .drive{display:flex}

/* the 3D stage stays dark in both themes: the x-ray glow needs a dark field */
.viewport{color-scheme:dark;--scr-bg:#0c0d0e;--line:#26282b;--line-2:#3b3e42;--fg:#f2f2f2;--muted:#a3a6aa;--faint:#72767b;--accent:#f2f2f2;--on-accent:#0c0d0e;--glass:rgba(16,17,19,.8);--ok:#3fd0a6;--warn:#ffa22e;--alert:#ff574c;color:var(--fg)}
.viewport{position:relative;overflow:hidden;background:radial-gradient(115% 85% at 50% 62%,var(--stage-1) 0%,var(--stage-2) 46%,var(--scr-bg) 82%)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:36px 40px 32px}
.hud-top,.hud-bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.hud-bottom{align-items:flex-end}
.eyebrow{font-family:var(--mono);font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
.hud h2{font-weight:500;font-size:52px;line-height:1.15;margin:4px 0 8px}
.meta{font-size:24px;color:var(--muted);margin:0 0 10px}
.meta b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.scanline{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:24px;color:var(--accent)}
.scanline i{width:12px;height:12px;border-radius:50%;background:currentColor}
.scanline.done{color:var(--muted)}
.scanline.done i{background:var(--warn)}
.live{display:inline-flex;align-items:center;gap:10px;margin-top:14px;font-size:22px;color:var(--muted);border:1px solid var(--line-2);border-radius:0;padding:6px 16px;background:var(--glass)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.live.on i{background:var(--ok)}
.hud-ctrls{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.modes{pointer-events:auto;display:flex;padding:6px;border:1px solid var(--line-2);border-radius:0;background:var(--glass)}
.modes button{appearance:none;border:0;background:transparent;color:var(--muted);font-size:28px;font-weight:500;line-height:1;padding:22px 34px;border-radius:0;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chipbtn{pointer-events:auto;appearance:none;border:1px solid var(--line-2);background:var(--glass);color:var(--fg);font-size:24px;line-height:1;padding:18px 26px;border-radius:0;cursor:pointer}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;gap:30px;font-size:24px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:12px}
.sw{width:16px;height:16px;border-radius:50%;background:var(--c);flex-shrink:0}
.hint{font-size:24px;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:0;padding:12px 24px;transition:opacity .5s}
.hint.gone{opacity:0}
.tag{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;--c:var(--alert)}
.tag .pt{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:4px solid var(--c);background:var(--scr-bg)}
.tag .stem{position:absolute;left:0;top:-92px;width:2px;height:80px;background:var(--c)}
.tag .lbl{position:absolute;left:-2px;top:-92px;transform:translateY(-100%);white-space:nowrap;background:var(--glass);border:2px solid var(--c);border-radius:0;padding:12px 20px 14px}
.tag.flip .lbl{left:auto;right:-2px}
.tag .lbl b{display:block;font-size:28px;font-weight:600;line-height:1.3}
.tag .lbl span{font-family:var(--mono);font-size:22px;color:var(--c)}
.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:80px;font-size:30px}

.panel{display:grid;grid-template-columns:420px minmax(0,1fr);gap:36px;padding:36px 40px;background:var(--bg-2);border-left:1px solid var(--line);min-height:0}
.col-l{display:flex;flex-direction:column;gap:24px;min-height:0}
.score{display:flex;align-items:flex-end;gap:22px}
.score-num{font-size:120px;font-weight:300;line-height:.84;font-variant-numeric:tabular-nums}
.score-num small{font-family:var(--mono);font-size:30px;color:var(--faint);margin-left:6px}
.verdict{font-size:32px;font-weight:600;margin:4px 0 0}
.cells{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.cells i{height:14px;border-radius:0;background:var(--c)}
.lseg{display:flex;padding:5px;border:1px solid var(--line-2);border-radius:0}
.lseg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font-size:26px;font-weight:500;line-height:1;padding:18px 10px;border-radius:0;cursor:pointer}
.lseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.rows{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.row{appearance:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;width:100%;min-height:92px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 12px;cursor:pointer;border-radius:0}
.row[aria-current="true"]{background:var(--sel)}
.row .nm{display:block;font-size:29px;font-weight:500;line-height:1.3}
.row .sh{display:block;font-size:23px;color:var(--muted);line-height:1.3}
.row .v{font-family:var(--mono);font-size:24px;color:var(--muted);white-space:nowrap}
.empty{font-size:26px;color:var(--muted);padding:24px 12px;margin:0;border-top:1px solid var(--line)}

.detail{display:flex;flex-direction:column;gap:26px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:0;padding:36px 40px;min-height:0;overflow-y:auto;--c:var(--alert)}
.d-head{display:flex;justify-content:space-between;align-items:center;gap:20px}
.pill{display:inline-flex;align-items:center;font-size:24px;font-weight:600;color:var(--c);padding:6px 18px;border-radius:0;border:2px solid currentColor}
.zone{font-size:24px;color:var(--faint);text-align:right}
.detail h3{font-size:48px;font-weight:600;line-height:1.25;margin:0}
.reading{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
.reading .num{display:flex;align-items:baseline;gap:10px}
.reading .val{font-family:var(--mono);font-size:96px;font-weight:500;line-height:.9;letter-spacing:-.02em}
.reading .unit{font-family:var(--mono);font-size:34px;color:var(--muted)}
.reading .cap{display:grid;font-size:24px;color:var(--muted);line-height:1.4;padding-bottom:4px}
.reading .cap span:last-child{color:var(--faint)}
.life{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.bar{height:12px;border-radius:0;background:var(--line-2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:0;background:var(--c)}
.life small{font-family:var(--mono);font-size:22px;color:var(--muted)}
.spark{color:var(--c)}
.spark svg{display:block;width:100%;height:auto}
.sp-axis{stroke:var(--line-2);stroke-width:1}
.sp-ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.sp-lab{fill:var(--faint);font-family:var(--mono);font-size:10px}
.facts{display:grid;gap:18px;margin:0}
.facts div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px}
.facts dt{font-size:24px;color:var(--faint);padding-top:2px}
.facts dd{margin:0;font-size:28px;line-height:1.5}
.srcs{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.srcs .lab{font-size:22px;color:var(--faint);margin-right:4px}
.srcs .t{font-family:var(--mono);font-size:21px;color:var(--muted);border:1px dashed var(--line-2);border-radius:0;padding:4px 14px}
.srcs .t.live{border-style:solid;border-color:var(--ok);color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:auto}
.btn{appearance:none;border:2px solid var(--line-2);background:transparent;color:var(--fg);font-size:28px;font-weight:600;line-height:1;padding:28px 36px;border-radius:0;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wide{flex:1}

/* card view: driving, or a narrow split window */
.drive{position:absolute;inset:0;flex-direction:column;align-items:center;gap:40px;padding:56px 96px 48px;background:var(--bg-2)}
.drive > *{width:100%;max-width:1760px}
.dv-head{display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:28px;color:var(--muted)}
.dv-head .grp{display:flex;align-items:center;gap:16px}
.dv-chip{font-size:24px;color:var(--muted);border:1px solid var(--line-2);border-radius:0;padding:8px 20px}
.dv-card{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;align-items:center;background:var(--bg-3);border:1px solid var(--line-2);border-radius:0;padding:56px;--c:var(--alert)}
.dv-card .pill{font-size:30px;padding:8px 24px}
.dv-left{display:flex;flex-direction:column;min-width:0}
.dv-left .pill{align-self:flex-start}
.dv-name{font-size:76px;font-weight:600;line-height:1.15;margin:28px 0 18px}
.dv-line{font-size:42px;color:var(--fg);line-height:1.35;margin:0}
.dv-left .btn{align-self:flex-start;margin-top:48px;font-size:34px;padding:34px 48px}
.voice{display:flex;align-items:flex-start;gap:20px;margin-top:32px;font-size:30px;color:var(--fg);background:var(--sel);border-radius:0;padding:22px 28px}
.voice svg{width:40px;height:40px;flex-shrink:0;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round}
.topcar{width:100%;height:auto}
.tc-body{fill:none;stroke:var(--line-2);stroke-width:4}
.tc-glass{fill:var(--bg-2);stroke:var(--line-2);stroke-width:3}
.tc-zone{fill:var(--bg-2);stroke:var(--line-2);stroke-width:3}
.tc-wheel{fill:var(--line-2)}
.tc-zone.hl,.tc-wheel.hl{fill:var(--c);stroke:var(--c);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.dv-foot{font-size:28px;color:var(--muted);margin:0}

/* overlays */
.banner{position:absolute;left:680px;top:28px;width:1200px;transform:translateX(-50%);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:32px;padding:28px 32px;background:var(--bg-3);border:2px solid var(--line-2);border-radius:0;box-shadow:0 18px 48px var(--shadow);z-index:5;--c:var(--alert)}
.screen[data-view="card"] .banner{left:50%}
.banner .dot{width:64px;height:64px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.banner .dot svg{width:34px;height:34px;stroke:var(--scr-bg);fill:none;stroke-width:3;stroke-linecap:round}
.banner b{display:block;font-size:34px;font-weight:600;line-height:1.3}
.banner span{display:block;font-size:26px;color:var(--muted)}
.banner .bb{display:flex;gap:14px}
.banner .btn{padding:24px 30px;font-size:28px}
.sheet{position:absolute;top:0;right:0;width:1200px;height:100%;background:var(--bg-2);border-left:1px solid var(--line-2);box-shadow:-24px 0 48px var(--shadow);display:flex;flex-direction:column;gap:32px;padding:40px 48px;z-index:4}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.sh-head h3{font-size:48px;font-weight:600;margin:0;line-height:1.25}
.sh-head p{font-size:26px;color:var(--muted);margin:8px 0 0}
.xbtn{appearance:none;width:88px;height:88px;flex-shrink:0;border-radius:50%;border:2px solid var(--line-2);background:transparent;cursor:pointer;display:grid;place-items:center}
.xbtn svg{width:36px;height:36px;stroke:var(--fg);stroke-width:3;stroke-linecap:round}
.sh-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:28px}
.sh-lab{font-size:24px;color:var(--faint);margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.opt{appearance:none;text-align:left;background:var(--bg-3);border:2px solid var(--line-2);border-radius:0;padding:28px 32px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.opt b{display:block;font-size:32px;font-weight:600}
.opt span{display:block;font-size:24px;color:var(--muted);margin-top:6px}
.slots{display:flex;flex-wrap:wrap;gap:16px}
.slot{appearance:none;font-family:var(--mono);font-size:28px;background:var(--bg-3);border:2px solid var(--line-2);border-radius:0;padding:22px 32px;cursor:pointer;color:var(--fg)}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:20px;counter-reset:st}
.steps li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:24px;align-items:start;font-size:30px;line-height:1.45;background:var(--bg-3);border:1px solid var(--line-2);border-radius:0;padding:24px 28px}
.steps li::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:30px}
.sh-note{font-size:24px;color:var(--faint);margin:0}
.sh-foot{display:flex;gap:16px}
.toast{position:absolute;left:50%;bottom:36px;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:1400px;background:var(--bg-3);border:2px solid var(--line-2);border-radius:0;padding:22px 32px;font-size:28px;transition:opacity .25s,transform .25s;z-index:6}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="screen" id="screen" data-view="park">
  <div class="apparea" id="apparea">
    <section class="park" aria-label="정차 중 화면">
      <div class="viewport" id="stage">
        <canvas id="view" aria-label="돌려볼 수 있는 3D 차량 모델"></canvas>
        <div class="fallback" id="fallback" hidden>3D 화면을 띄우지 못했어요. 오른쪽 점검 목록은 그대로 볼 수 있어요.</div>
        <div class="tag" id="tag" hidden><span class="stem"></span><span class="pt"></span><span class="lbl"><b id="tagName"></b><span id="tagVal"></span></span></div>
        <div class="hud">
          <div class="hud-top">
            <div>
              <p class="eyebrow">Vehicle health scan</p>
              <h2>차량 건강검진</h2>
              <p class="meta" id="odoLine">누적 주행 <b>48,210</b> km</p>
              <div class="scanline" id="scanline"><i></i><span id="scanText">진단 준비 중</span></div>
              <div class="live" id="liveBadge"><i></i><span id="liveText">예시 데이터</span></div>
            </div>
            <div class="hud-ctrls">
              <div class="modes" role="group" aria-label="보기 방식">
                <button type="button" id="mode-xray" data-mode="xray" aria-pressed="true">투시</button>
                <button type="button" id="mode-exterior" data-mode="exterior" aria-pressed="false">외관</button>
                <button type="button" id="mode-skeleton" data-mode="skeleton" aria-pressed="false">골격</button>
              </div>
              <button type="button" class="chipbtn" id="dataToggle" aria-pressed="false" hidden>예시 데이터로 보기</button>
              <button type="button" class="chipbtn" id="demoDrive" hidden>주행 화면 미리보기</button>
            </div>
          </div>
          <div class="hud-bottom">
            <div class="legend" aria-hidden="true">
              <span><i class="sw" style="--c:var(--alert)"></i>즉시 정비</span>
              <span><i class="sw" style="--c:var(--warn)"></i>점검 권장</span>
              <span><i class="sw" style="--c:var(--ok)"></i>양호</span>
            </div>
            <div class="hint" id="hint">드래그해서 돌리고, 부품을 누르면 상태가 나와요</div>
          </div>
        </div>
      </div>

      <aside class="panel" aria-label="점검 결과">
        <div class="col-l">
          <div class="score">
            <div class="score-num"><span id="scoreVal">70</span><small>/100</small></div>
            <div><p class="eyebrow">건강 점수</p><p class="verdict" id="verdict">점검이 필요해요</p></div>
          </div>
          <div class="cells" id="cells" aria-hidden="true"></div>
          <div class="lseg" role="group" aria-label="목록 범위">
            <button type="button" id="list-issues" aria-pressed="true">확인 필요</button>
            <button type="button" id="list-all" aria-pressed="false">전체</button>
          </div>
          <div class="rows" id="rows"></div>
        </div>
        <article class="detail" id="detail" aria-live="polite">
          <div class="d-head"><span class="pill" id="dPill"></span><span class="zone" id="dZone"></span></div>
          <h3 id="dName"></h3>
          <div class="reading">
            <div class="num"><span class="val" id="dVal"></span><span class="unit" id="dUnit"></span></div>
            <div class="cap"><span id="dLabel"></span><span id="dRef"></span></div>
          </div>
          <div class="life" id="dLife"><div class="bar"><span id="dBar"></span></div><small id="dLifeTxt"></small></div>
          <div class="spark" id="dSpark"></div>
          <dl class="facts">
            <div><dt>원인</dt><dd id="dWhy"></dd></div>
            <div><dt>할 일</dt><dd id="dAct"></dd></div>
            <div id="dCostRow"><dt>비용</dt><dd id="dCost"></dd></div>
          </dl>
          <div class="srcs" id="dSrcs"></div>
          <div class="actions">
            <button type="button" class="btn primary" id="bookBtn">정비소 예약</button>
            <button type="button" class="btn primary" id="diyBtn">직접 교체 방법</button>

  if (!tagReady || !it){ tagEl.hidden = true; return; }
  var cands = activeAnchors(it), best = cands[0], bd = Infinity;
  cands.forEach(function(a){ var d = a.distanceToSquared(camera.position); if (d < bd){ bd = d; best = a; } });
  pv.copy(best).project(camera);
  if (pv.z > 1 || pv.z < -1){ tagEl.hidden = true; return; }
  var w = stage.clientWidth, h = stage.clientHeight;
  var x = (pv.x * 0.5 + 0.5) * w, y = (-pv.y * 0.5 + 0.5) * h;
  tagEl.hidden = false;
  tagEl.classList.toggle('flip', x > w - 420);
  tagEl.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
}
selectHook = function(){ if (!scan.active) tagReady = true; };

/* ================= loop ================= */
function finishScan(){
  scan.active = false; scan.x = -10; xrayMat.uniforms.uScan.value = -10; scanPlane.visible = false; tagReady = true;
  var n = issues().length;
  $('scanText').textContent = n ? '진단 완료 · 확인 필요 ' + n + '건' : '진단 완료 · 모두 정상';
  $('scanline').classList.add('done');
  setTimeout(function(){ if (!state.drive && !state.sheet) showBanner(); }, 500);
}
if (!scan.active) finishScan();
var clock = new THREE.Clock();
function frame(now){
  requestAnimationFrame(frame);
  if (state.drive || state.compact || document.hidden) return;
  var t = clock.getElapsedTime();
  if (scan.active){
    var p = (now - scan.t0) / scan.dur;
    if (p >= 0 && p <= 1){
      var x = 2.7 - 5.4 * easeIO(p);
      scan.x = x; xrayMat.uniforms.uScan.value = x; scanPlane.position.x = x; scanPlane.visible = true;
      $('scanText').textContent = '진단 중 ' + Math.round(p * 100) + '%';
    } else if (p > 1) finishScan();
  }
  if (tween){
    var k = Math.min(1, (now - tween.t0) / tween.dur), e = easeIO(k);
    controls.target.lerpVectors(tween.fromT, tween.toT, e);
    var sph = new THREE.Spherical(
      tween.from.radius + (tween.toR - tween.from.radius) * e,
      tween.from.phi + (tween.toPhi - tween.from.phi) * e,
      tween.from.theta + tween.dTheta * e);
    camera.position.setFromSpherical(sph).add(controls.target);
    if (k >= 1) tween = null;
  }
  controls.update();
  for (var i = 0; i < ITEMS.length; i++) applyVisual(ITEMS[i], t);
  renderer.render(scene, camera);
  updateTag();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize();
camera.position.copy(controls.target).addScaledVector(DEFAULT_DIR, fitDistance());
requestAnimationFrame(frame);
if (Android && Android.ready) Android.ready();
})();
</script>
